name: Build, Publish and Release Container Image

on:
  push:
    tags:
      - 'v*' # 仅在推送版本标签（例如 v1.0.0, v1.0.1 等）时自动触发
  workflow_dispatch:
    inputs:
      publish_latest:
        description: '手动构建时是否将镜像更新为 latest'
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx --bun playwright install --with-deps chromium webkit

      - name: Run unit and integration tests
        run: bun run test:run

      - name: Typecheck
        run: bunx --bun tsc --noEmit

      - name: Build production bundle
        run: bun run build

      - name: Check bundle size
        run: bun run check:bundle

      - name: Run end-to-end tests
        run: bun run test:e2e

  publish:
    name: Build and Publish Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest == true }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: false
          cache-from: type=gha,scope=topic-kanban
          cache-to: type=gha,mode=max,scope=topic-kanban,ignore-error=true

      - name: Inspect multi-platform manifest
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"

      - name: Smoke test amd64 image
        shell: bash
        run: |
          set -euo pipefail
          container_name=topic-kanban-smoke-${GITHUB_RUN_ID}
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container_name" \
            --platform linux/amd64 \
            --publish 127.0.0.1:3030:3030 \
            --env APP_PASSWORD=ci-smoke-password \
            --env DATA_DIR=/app/data \
            "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}" >/dev/null

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3030/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_name"
          exit 1

      - name: Generate image provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### 🎬 选题生产工作台 (Topic Kanban Studio) ${{ github.ref_name }}

            多架构极简容器镜像（`linux/amd64` + `linux/arm64`）已自动构建并推送到 GitHub Container Registry。

            #### 🐳 快速拉取与运行命令：
            ```bash
            # 拉取当前版本镜像
            docker pull ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.version }}

            # 启动容器 (数据持久化保存在当前目录下的 ./data)
            docker run -d \
              --name topic-kanban \
              --restart unless-stopped \
              -p 3030:3030 \
              -e APP_PASSWORD="your_secure_password" \
              -e QUICK_DROP_TOKEN="your_quick_drop_token" \
              -e PUBLIC_BASE_URL="https://kanban.yourdomain.com" \
              -v ./data:/app/data \
              ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.version }}
            ```
