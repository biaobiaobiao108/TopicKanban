name: Build, Publish and Release Container Image

on:
  push:
    tags:
      - 'v*' # 仅在推送版本标签（例如 v1.0.0, v1.0.1 等）时自动触发
  release:
    types: [published] # 在 GitHub 网页发布 Release 时也能自动触发
  workflow_dispatch: # 支持在 GitHub 网页上手动一键触发

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    name: Test, Build and Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 允许创建和发布 GitHub Release
      packages: write # 允许推送容器镜像到 GitHub Packages (GHCR)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 Git 历史用于自动生成 Release Changelog

      - name: Set lower case image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit & integration tests
        run: pnpm test:run

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### 🎬 选题生产工作台 (Topic Kanban Studio) ${{ github.ref_name }}

            多架构极简容器镜像（`linux/amd64` + `linux/arm64`）已自动构建并推送到 GitHub Container Registry。

            #### 🐳 快速拉取与运行命令：
            ```bash
            # 拉取当前版本镜像
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

            # 启动容器 (数据持久化保存在当前目录下的 ./data)
            docker run -d \
              --name topic-kanban \
              --restart unless-stopped \
              -p 3000:3000 \
              -e APP_PASSWORD="your_secure_password" \
              -e QUICK_DROP_TOKEN="your_quick_drop_token" \
              -e PUBLIC_BASE_URL="https://kanban.yourdomain.com" \
              -v ./data:/app/data \
              ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
