name: CI Test and Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun install packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-1.4.2-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify preinstalled Google Chrome
        run: google-chrome --version

      - name: Run unit and integration tests
        run: bun run test:run

      - name: Typecheck
        run: bunx --bun tsc --noEmit

      - name: Build production bundle
        run: bun run build

      - name: Check bundle size
        run: bun run check:bundle

      - name: Run end-to-end tests
        run: bun run test:e2e
